<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lalbucas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 /* layout: uma coluna de trabalho — exame em cima, laudo validado embaixo, como na estação de laudo */
 --bg:#eef1f5; --panel:#ffffff; --ink:#18202b; --muted:#5b6778; --line:#d5dbe4;
 --accent:#1d5fb8; --accent-ink:#ffffff; --warn:#9a5b00; --warn-bg:#fdf1dd; --ok:#1d7a46; --ok-bg:#e3f4ea; --err:#b3261e; --err-bg:#fbe7e5;
 --font-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
 --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){--bg:#0f141b;--panel:#171e28;--ink:#e6ebf2;--muted:#97a3b4;--line:#2a3442;--accent:#5b9bef;--accent-ink:#0b1220;--warn:#f0b35a;--warn-bg:#33270f;--ok:#5fcf8f;--ok-bg:#12291c;--err:#f28b82;--err-bg:#35161a;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#171e28;--ink:#e6ebf2;--muted:#97a3b4;--line:#2a3442;--accent:#5b9bef;--accent-ink:#0b1220;--warn:#f0b35a;--warn-bg:#33270f;--ok:#5fcf8f;--ok-bg:#12291c;--err:#f28b82;--err-bg:#35161a;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.2px;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.on{background:var(--ok-bg);color:var(--ok)}
.status.work{background:var(--bg);color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:92px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:500;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:0}
.status{font-size:13px;font-weight:500;padding:8px 10px;border-radius:8px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.err{background:var(--err-bg);color:var(--err)}
.paper{background:#ffffff;color:#000000;border:1px solid var(--line);border-radius:6px;padding:20px 22px;overflow-x:auto}
.copy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Lalbucas</h1>
 </header>

 <section class="panel" aria-labelledby="t-exame">
  <h2 id="t-exame">Exame</h2>
  <div class="row">
   <label for="rota">Exame
    <select id="rota">
     <option value="abdomen-full">TC de abdome superior e pelve</option>
     <option value="ct-chest-full">TC de tórax</option>
     <option value="ct-cranium-full">TC de crânio</option>
     <option value="us-abdomen-full">US de abdome total</option>
     <option value="us-doppler-venoso-mmii-full">Doppler venoso de MMII (TVP)</option>
     <option value="rm-cranium-full">RM de crânio</option>
     <option value="rm-pelvis-endo-full">RM de pelve (endometriose)</option>
    </select>
   </label>
   <label for="indicacao">Indicação
    <input id="indicacao" value="dor abdominal.">
   </label>
  </div>
  <div class="row" id="row-extra">
   <label for="lateralidade" id="lat-wrap" class="hidden">Lateralidade
    <select id="lateralidade">
     <option value="direito">Direito</option>
     <option value="esquerdo">Esquerdo</option>
     <option value="bilateral">Bilateral</option>
    </select>
   </label>
   <label for="tecnica" id="tec-wrap" class="hidden">Técnica (RM)
    <input id="tecnica" value="estudo por ressonância magnética do crânio.">
   </label>
  </div>
  <div class="actions">
   <button class="primary" id="btn-normal">Gerar laudo normal</button>
  </div>
  <p class="hint">O laudo é montado e validado neste navegador. Nada é enviado para fora.</p>
 </section>

 <section class="panel" aria-labelledby="t-laudo">
  <div class="actions" style="justify-content:space-between">
   <h2 id="t-laudo">Laudo</h2>
   <span class="tag" id="origem">Normal</span>
  </div>
  <div class="status ok" id="status">Validado: formato RIS e cobertura de compartimentos OK.</div>
  <div class="paper" id="preview"></div>
  <div class="copy">
   <button id="btn-html">Copiar HTML</button>
   <button id="btn-fmt">Copiar formatado</button>
  </div>
 </section>
</div>

<script type="text/plain" id="motor">(()=>{
// Operational abdominal baseline (not certified as the most recently user-approved
// complete mask). Only historically evidenced fragments may be called approved.
// The 2026-10-21 correction excludes "distensão anômala" from normality blocks.
const CT_ABDOMEN_MASK_SOURCE='core:ct-abdomen-pelvis-working-v2';
const CT_ABDOMEN_MASK_BLOCKS=Object.freeze([
 'Fígado com dimensões, contornos e densidade preservados.',
 'Vesícula biliar sem cálculos radiodensos. Não há dilatação das vias biliares.',
 'Pâncreas, baço e adrenais sem alterações tomográficas significativas.',
 'Rins com dimensões e contornos preservados bilateralmente, sem sinais de litíase ou dilatação dos sistemas coletores. Ureteres sem dilatação.',
 'Aorta abdominal e veia cava inferior com calibres preservados.',
 'Alças intestinais com calibre preservado, sem sinais de obstrução ou alterações inflamatórias periapendiculares.',
 'Bexiga com contornos regulares, sem espessamento parietal evidente.',
 'Ausência de linfonodomegalias, líquido livre, coleções ou pneumoperitônio.',
 'Estruturas ósseas incluídas sem lesões focais evidentes.'
]);
function abdomenMask(){return {sourceId:CT_ABDOMEN_MASK_SOURCE,blocks:[...CT_ABDOMEN_MASK_BLOCKS]};}
function isFullCTAbdomen(s){const title=norm(s.title);return /(?:tomografia|\btc\b)/.test(title)&&/abdom/.test(title)&&/pelve/.test(title)&&s.sourceContract?.scope==='FULL';}
// Literal <abdome_total><canonical_normal> from Guardian 8.5.20.
// The route avoids source searching between dictation and the clinical renderer.
const US_ABDOMEN_MASK_SOURCE='guardian-runtime-8.5.20.txt:abdome_total:canonical_normal';
const US_ABDOMEN_MASK_BLOCKS=Object.freeze([
 'Fígado com dimensões preservadas, contornos regulares e parênquima com ecogenicidade e ecotextura homogêneas.',
 'Vesícula biliar normodistendida, de paredes finas e regulares, com conteúdo anecoico e sem imagens calculosas. Vias biliares intra e extra-hepáticas sem dilatação.',
 'Pâncreas, nas porções visibilizadas, com dimensões, contornos e ecotextura preservados.',
 'Baço com dimensões preservadas, contornos regulares e ecotextura homogênea.',
 'Aorta abdominal com calibre preservado nos segmentos avaliados. Veia cava inferior sem alterações ultrassonográficas significativas.',
 'Rins tópicos, com dimensões e contornos preservados, espessura parenquimatosa e ecogenicidade habituais, mantendo diferenciação corticomedular, sem dilatação dos sistemas coletores.',
 'Bexiga sem alterações ultrassonográficas significativas, quando adequadamente repleta para avaliação.',
 'Não se observa líquido livre na cavidade abdominal.'
]);
function usAbdomenMask(){return {sourceId:US_ABDOMEN_MASK_SOURCE,blocks:[...US_ABDOMEN_MASK_BLOCKS]};}
function isFullUSAbdomen(s){return s.title==='ULTRASSONOGRAFIA DO ABDOME TOTAL'&&s.sourceContract?.scope==='FULL';}
// Doppler venoso de MMII (pesquisa de TVP): texto clínico adaptado da máscara do Drive
// "VENOSO MMII - TVP" (Máscaras atualizadas 2026), modelos NORMAL unilateral/bilateral.
// Cobertura conforme VENOUS_DOPPLER_COMPACT_FULL_PROTOCOL_8520 do Guardian 8.5.20.
const US_DOPPLER_MMII_MASK_SOURCE='drive:VENOSO_MMII_TVP:2026:normal_unilateral_bilateral';
const US_DOPPLER_MMII_TITLES=Object.freeze({
 direito:'ECODOPPLER VENOSO DO MEMBRO INFERIOR DIREITO',
 esquerdo:'ECODOPPLER VENOSO DO MEMBRO INFERIOR ESQUERDO',
 bilateral:'ECODOPPLER VENOSO DOS MEMBROS INFERIORES'
});
function usDopplerLimbBlocks(side,prefixed){const m=prefixed?'Membro inferior '+side+': ':'';const M=prefixed?'Membro inferior '+side+': ':'';return [
 m+'Veias femorais comum, superficial e profunda pérvias, compressíveis, de calibres normais e com fluxo fásico com a respiração.',
 M+'Veia poplítea pérvia, compressível, de calibre normal e com fluxo fásico com a respiração.',
 M+'Veias gastrocnêmias, soleares, fibulares, tibiais anteriores e tibiais posteriores pérvias, compressíveis, de calibres normais e com fluxos preservados.',
 M+'Veia safena magna pérvia, compressível, de calibre normal e com fluxo preservado.',
 M+'Veia safena parva pérvia, compressível, de calibre normal e com fluxo preservado.'
];}
function usDopplerLaterality(title){
 const t=Object.entries(US_DOPPLER_MMII_TITLES).find(([,v])=>v===title);
 if(!t)throw Error('us_doppler_mmii_title_required');
 return t[0];
}
function usDopplerMask(title){
 const lat=usDopplerLaterality(title);
 const blocks=lat==='bilateral'?[...usDopplerLimbBlocks('direito',true),...usDopplerLimbBlocks('esquerdo',true)]:usDopplerLimbBlocks(lat,false);
 return {sourceId:US_DOPPLER_MMII_MASK_SOURCE+':'+lat,blocks};
}
function isFullUSDopplerMMII(s){return Object.values(US_DOPPLER_MMII_TITLES).includes(s.title)&&s.sourceContract?.scope==='FULL';}
// Literal unconditional lines from <cranio><canonical_normal> in Guardian 8.5.20.
// The ischemia-negative line is conditional in the normative source; it must
// never be automatically emitted. A supported clinical change can add it.
const CT_CRANIUM_MASK_SOURCE='guardian-runtime-8.5.20.txt:cranio:canonical_normal:unconditional';
const CT_CRANIUM_MASK_BLOCKS=Object.freeze([
 'Não se identificam lesões expansivas intracranianas, coleções extra-axiais ou hemorragias intracranianas.',
 'Sistema ventricular com dimensões e morfologia preservadas. Cisternas da base e sulcos corticais sem alterações significativas.',
 'Não há desvio das estruturas da linha média.',
 'Parênquima encefálico sem alterações significativas da atenuação.',
 'Fossa posterior sem alterações tomográficas significativas.',
 'Calota craniana sem alterações ósseas significativas nas imagens avaliadas.',
 'Seios paranasais e células mastoideas, nas porções incluídas, sem alterações significativas.'
]);
function ctCraniumMask(){return {sourceId:CT_CRANIUM_MASK_SOURCE,blocks:[...CT_CRANIUM_MASK_BLOCKS]};}
// Operational anatomical fallback, not a claim of a previously approved literal mask.
// Used only when a reviewed canonical mask is unavailable (Guardian fallback_modalidade).
function ctSinusMask(){return {sourceId:'guardian-8.5.20:seios-da-face:operational-fallback-v1',blocks:[
 'Seios maxilares, frontais, esfenoidais e células etmoidais com aeração preservada.',
 'Vias de drenagem dos seios paranasais pérvias.',
 'Fossas nasais sem obliterações.',
 'Septo nasal sem desvio significativo. Conchas nasais sem alterações evidentes.',
 'Paredes ósseas dos seios paranasais sem alterações evidentes.'
]};}
function isFullCTSinus(s){return s.title==='TOMOGRAFIA COMPUTADORIZADA DOS SEIOS DA FACE'&&s.sourceContract?.scope==='FULL';}
function isFullCTCranium(s){return s.title==='TOMOGRAFIA COMPUTADORIZADA DO CRÂNIO'&&s.sourceContract?.scope==='FULL';}
// Approved literal baseline RM-CRANIO-FULL-001 (Lucas, 31/10/2026).
// The pinned source is references/rm-cranio-full-001.md, not the TC Guardian mask.
const RM_CRANIUM_MASK_SOURCE='lucas:RM-CRANIO-FULL-001:v1.0';
const RM_CRANIUM_MASK_BLOCKS=Object.freeze([
 'Parênquima encefálico com morfologia e intensidade de sinal preservadas.',
 'Ausência de restrição à difusão ou sinais de isquemia recente.',
 'Não se observam sinais de hemorragia intracraniana.',
 'Sistema ventricular com dimensões e morfologia preservadas.',
 'Sulcos corticais e cisternas da base preservados.',
 'Estruturas da linha média centradas.',
 'Tronco encefálico e cerebelo sem alterações significativas de sinal.',
 'Ausência de lesões expansivas ou coleções extra-axiais.',
 'Seios paranasais, nas porções incluídas, sem alterações significativas.',
 'Células mastoideas aeradas.'
]);
function rmCraniumMask(){return {sourceId:RM_CRANIUM_MASK_SOURCE,blocks:[...RM_CRANIUM_MASK_BLOCKS]};}
function isFullRMCranium(s){return s.title==='RESSONÂNCIA MAGNÉTICA DO CRÂNIO'&&s.sourceContract?.scope==='FULL';}
// Precompiled operational chest mask: Guardian 8.5.20 torax coverage and
// preferred airway phrase; no claim of a previously approved literal full mask.
const CT_CHEST_MASK_SOURCE='guardian-runtime-8.5.20.txt:torax:operational-v1';
const CT_CHEST_MASK_BLOCKS=Object.freeze([
 'Traqueia e brônquios principais pérvios.',
 'Parênquima pulmonar sem opacidades focais ou alterações intersticiais evidentes.',
 'Ausência de derrame pleural ou pneumotórax.',
 'Mediastino e regiões hilares sem massas ou linfonodomegalias.',
 'Coração com dimensões preservadas. Ausência de derrame pericárdico.',
 'Escore coronariano visual qualitativo: zero.',
 'Aorta torácica com calibre preservado.',
 'Tronco da artéria pulmonar com calibre preservado.',
 'Estruturas ósseas incluídas sem lesões focais evidentes.',
 'Partes moles sem coleções.'
]);
function ctChestMask(){return {sourceId:CT_CHEST_MASK_SOURCE,blocks:[...CT_CHEST_MASK_BLOCKS]};}
function isFullCTChest(s){return s.title==='TOMOGRAFIA COMPUTADORIZADA DO TÓRAX'&&s.sourceContract?.scope==='FULL';}
function validateCompactRISTables(html) {
 const errors=[];
 // This checks only actual HTML table tags, never root div width or prose references.
 const tables=String(html).match(/<table\b[^>]*>[\s\S]*?<\/table>/gi)||[];
 for(const table of tables){
  const open=table.match(/^<table\b[^>]*>/i)?.[0]||'';
  const css=(open.match(/\bstyle\s*=\s*["']([^"']*)["']/i)?.[1]||'').toLowerCase();
  if(!/\bwidth\s*:\s*auto\s*(?:;|$)/.test(css)||!/\btable-layout\s*:\s*auto\s*(?:;|$)/.test(css)||!/\bborder-collapse\s*:\s*collapse\s*(?:;|$)/.test(css)||/\bwidth\s*:\s*(?:100%|\d+(?:\.\d+)?px)\b/.test(css)||/\bwidth\s*=\s*["']?(?:100%|\d+)/i.test(open))errors.push('ris_table_width');
  const cells=table.match(/<(?:th|td)\b[^>]*>/gi)||[];
  if(!cells.length){errors.push('ris_table_cells');continue;}
  for(const cell of cells){
   const style=(cell.match(/\bstyle\s*=\s*["']([^"']*)["']/i)?.[1]||'').toLowerCase();
   if(!/\bpadding\s*:\s*2px\s+6px\s*(?:;|$)/.test(style)||!/\bborder\s*:\s*1px\s+solid\s+#(?:999|999999)\b/.test(style)||/\bbackground(?:-color)?\s*:/.test(style)){errors.push('ris_table_cell_layout');break;}
   if(!/\bwhite-space\s*:\s*nowrap\s*(?:;|$)/.test(style))errors.push('ris_table_cell_wrap_risk');
  }
  const trs=table.match(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)||[];
  const widths=trs.map(tr=>(tr.match(/<(?:th|td)\b/gi)||[]).length);
  if(widths.length<2||widths.some(w=>w!==widths[0]||w<2||w>3))errors.push('ris_table_column_mismatch');
 }
 return [...new Set(errors)];
}
function validateRIS(text,{grammaticalUppercase=false}={}) {
 const errors=[];
 if(text.split('\n')[0]!=='```html'||!text.endsWith('\n```')) errors.push('fence');
 const html=text.replace(/^```html\n/,'').replace(/\n```$/,'');
 errors.push(...validateCompactRISTables(html));
 const root=html.match(/^<div\b[^>]*>/i)?.[0]||'';
 if(!/background-color\s*:\s*#ffffff\b/i.test(root)||!/color\s*:\s*#000000\b/i.test(root)) errors.push('preview');
 if(/font-weight\s*:\s*(?:bold|[6-9]00)/i.test(root)) errors.push('inherited_conclusion_bold');
 const i=html.search(/CONCLUS[ÃA]O\s*:/i);
 if(i<0) errors.push('conclusion_missing');
 else {
  const after=html.slice(i).replace(/^CONCLUS[ÃA]O\s*:\s*<\/(?:b|strong)>\s*<\/div>/i,'');
  if(/<(?:b|strong)\b|font-weight\s*:\s*(?:bold|[6-9]00)|\*\*/i.test(after)) errors.push('conclusion_bold');
 }
 // Track inherited inline bold across ancestors, not merely tags after heading.
 const stack=[];let inConclusion=false;
 for(const token of html.match(/<[^>]+>|[^<]+/g)||[]) {
  if(token.startsWith('</')){const name=token.match(/^<\/([\w-]+)/)?.[1]?.toLowerCase();const j=stack.findLastIndex(x=>x.name===name);if(j>=0)stack.splice(j);continue;}
  if(token.startsWith('<')){const name=token.match(/^<([\w-]+)/)?.[1]?.toLowerCase();if(name&&!['br','img','hr','input'].includes(name))stack.push({name,bold:(stack.at(-1)?.bold||false)||['b','strong'].includes(name)||/font-weight\s*:\s*(?:bold|[6-9]00)/i.test(token)});continue;}
  if(/CONCLUS[ÃA]O\s*:/i.test(token)){inConclusion=true;continue;}
  if(inConclusion&&token.trim()&&stack.at(-1)?.bold)errors.push('inherited_conclusion_bold');
 }
 // Validate visible header contents, including nested inline markup and entities.
 const visible=html.replace(/<[^>]*>/g,' ').replace(/&nbsp;|&#160;|&#xA0;/gi,' ').replace(/&#(\d+);|&#x([0-9a-f]+);/gi,(_,d,h)=>String.fromCodePoint(parseInt(d||h,d?10:16))).normalize('NFC');
 const proper=new Set(['Chagas','Parkinson','Alzheimer','Crohn','Hodgkin','Doppler','Budd','Chiari','Swyer','James','MacLeod']);
 for(const [label,code] of [['INDICAÇÃO','indication_case'],['TÉCNICA','technique_case'],['COMPARAÇÃO','comparison_case']]){
  const content=visible.match(new RegExp(label+'\\s*:\\s*([^]*?)(?=INDICAÇÃO\\s*:|TÉCNICA\\s*:|COMPARAÇÃO\\s*:|ANÁLISE\\s*:|CONCLUSÃO\\s*:|$)','i'))?.[1]?.trim();
  const first=content?.match(/^[\s"'“‘(]*([\p{L}\p{M}]+)/u)?.[1];
  if(!first||label==='INDICAÇÃO'&&grammaticalUppercase)continue;
  const acronym=/^\p{Lu}{2,}$/u.test(first);
  if(/^\p{Lu}\p{Ll}/u.test(first)&&!acronym&&!proper.has(first))errors.push(code);
 }
 return errors;
}
function validateHostDeliveryBoundary(claim={}) {
 const errors=[];
 if(claim.claimsByteIdentity===true&&claim.emittedBytes!==claim.observedDeliveredBytes)errors.push('post_send_byte_mismatch');
 if(claim.claimsHostFixed===true&&claim.hostEndToEndVerified!==true)errors.push('host_fix_unverified');
 if(claim.claimsNativeChatIntegration===true&&claim.appToolResourceWired!==true)errors.push('native_integration_unwired');
 if(claim.postSendMutationDetected===true&&claim.packageCanRepairHostMutation===true)errors.push('package_cannot_repair_host_mutation');
 return errors;
}
function validateClinicalReplyPriority(plan={}) {
 const errors=[];
 if(plan.clinicalFollowup!==true)return errors;
 if(plan.directClinicalResponse!==true)errors.push('clinical_reply_missing');
 if(plan.maintenanceBeforeClinical===true)errors.push('maintenance_preempted_clinical_reply');
 if(plan.reportChanged===true&&plan.completeCorrectedReportFirst!==true)errors.push('complete_corrected_report_missing');
 return errors;
}
function validateImplicitRouting(plan={}) {
 const errors=[];
 if(plan.radiologyTask===true&&plan.ownerLoadedBeforeClinical!==true)errors.push('implicit_owner_route_missing');
 if(plan.radiologyTask===true&&plan.memoryOnlySource===true)errors.push('memory_only_owner_absent');
 if(plan.radiologyTask===true&&plan.requiresMention===true)errors.push('mention_requirement_forbidden');
 if(plan.claimsLoaded===true&&plan.hostExecutionEvidence!==true)errors.push('host_evidence_missing');
 return errors;
}
function validateReleaseClaim(claim={}) {
 const errors=[];
 if(claim.claimsReleaseState!==true)return errors;
 if(claim.liveMetadataRead!==true)errors.push('release_live_evidence_missing');
 if(claim.readbackVerified!==true)errors.push('release_readback_missing');
 if(claim.evidenceFromPriorAttempt===true)errors.push('prior_attempt_not_current');
 if(claim.claimedVersion!==claim.liveVersion)errors.push('release_version_mismatch');
 if(claim.claimedReleaseId!==claim.liveReleaseId)errors.push('release_id_mismatch');
 return errors;
}
function validateBaselineSpecificity(text) {
 const plain=String(text).replace(/<[^>]*>/g," ").normalize("NFC").toLocaleLowerCase("pt-BR").replace(/\s+/g," ");
 return (plain.match(/sem alterações tomográficas significativas/g)||[]).length>=2 ? ["BASELINE_GENERIC_BOILERPLATE_REGRESSION"] : [];
}
// Explicit structured context scopes the check; no diagnosis or recommendation is inferred.
const norm=s=>String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
function validateBladderMRIRecommendation(text,context={}) {

const api={ctSinusMask,ctChestMask,renderReply,validateDeliveryLexicon,buildClinicalState,renderClinical,renderMasked,renderAbdomenFull,renderUSAbdomenFull,renderCTCraniumFull,renderRMCraniumFull,render,abdomenMask,usAbdomenMask,ctCraniumMask,rmCraniumMask,maskOverlay,validate:validateFullRIS};
return Object.freeze({...api,...createClinicalEntry(api)});

<script>
(function(){
 let core=null, html='';
 const $=id=>document.getElementById(id);
 const ERROS={normal_route_unsupported:'exame sem máscara',doppler_laterality_required:'escolha a lateralidade',mri_technique_required:'preencha a técnica da RM'};
 function setStatus(ok,msg){const s=$('status');s.className='status '+(ok?'ok':'err');s.textContent=msg;}
 try{core=Function('return '+$('motor').textContent)();}catch(e){setStatus(false,'Não carregou: '+e.message);}
 const ponto=s=>{s=String(s||'').trim();if(!s)return s;s=s.charAt(0).toLowerCase()+s.slice(1);return /[.!?]$/.test(s)?s:s+'.';};
 function syncFields(){
  const r=$('rota').value;
  $('lat-wrap').classList.toggle('hidden',r!=='us-doppler-venoso-mmii-full');
  $('tec-wrap').classList.toggle('hidden',r!=='rm-cranium-full');
  $('row-extra').classList.toggle('hidden',r!=='us-doppler-venoso-mmii-full'&&r!=='rm-cranium-full');
 }
 function gerar(){
  if(!core)return;
  const r=$('rota').value;
  const q={id:'caso-'+Date.now(),route:r,indication:ponto($('indicacao').value)||'não informada.',normalEvidence:'normal'};
  if(r==='us-doppler-venoso-mmii-full')q.laterality=$('lateralidade').value;
  if(r==='rm-cranium-full')q.technique=ponto($('tecnica').value);
  try{
   html=core.renderNormal(q).slice(8,-4);
   $('preview').innerHTML=html;
   setStatus(true,'Validado: formato RIS e cobertura de compartimentos OK.');
  }catch(e){const c=String(e&&e.message||e);setStatus(false,'Bloqueado: '+(ERROS[c]||c)+'.');}
 }
 $('rota').addEventListener('change',syncFields);
 $('btn-normal').addEventListener('click',gerar);
 function flash(b,t){const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1500);}
 function fallbackCopy(node){const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');}catch(e){}s.removeAllRanges();}
 $('btn-html').addEventListener('click',()=>{
  const b=$('btn-html');
  const fb=()=>{const t=document.createElement('textarea');t.value=html;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}t.remove();flash(b,'Copiado');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(html).then(()=>flash(b,'Copiado')).catch(fb);else fb();
 });
 $('btn-fmt').addEventListener('click',()=>{
  const b=$('btn-fmt');
  try{
   const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([$('preview').innerText],{type:'text/plain'})});
   navigator.clipboard.write([item]).then(()=>flash(b,'Copiado')).catch(()=>{fallbackCopy($('preview'));flash(b,'Copiado');});
  }catch(e){fallbackCopy($('preview'));flash(b,'Copiado');}
 });
 syncFields();
 gerar();
})();
</script>
